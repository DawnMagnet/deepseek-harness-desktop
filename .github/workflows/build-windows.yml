name: Build Windows Desktop App

"on":
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - name: Check upstream alignment
        run: node scripts/check-upstream-version.mjs --strict
      - name: Build installer
        run: pnpm build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
