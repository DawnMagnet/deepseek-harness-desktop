name: Sync upstream dsh release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve latest upstream dsh tag
        id: upstream
        shell: bash
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/deepseek-ai/deepseek-harness.git 'refs/tags/dsh-v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo 'Upstream has no dsh-v* tag yet; nothing to synchronize.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply upstream version
        if: steps.upstream.outputs.found == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git fetch origin --tags
          if git show-ref --tags --verify --quiet "refs/tags/$UPSTREAM_TAG"; then
            echo "Tag $UPSTREAM_TAG already exists locally; no new release."
            exit 0
          fi
          node scripts/sync-upstream-version.mjs "$UPSTREAM_TAG"
          pnpm install --lockfile-only
          node scripts/check-upstream-version.mjs --expected "$UPSTREAM_TAG"

      - name: Commit and push synchronized tag
        if: steps.upstream.outputs.found == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: sync upstream $UPSTREAM_TAG" || exit 0
          git push origin HEAD:master
          git tag -a "$UPSTREAM_TAG" -m "Release $UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG"
