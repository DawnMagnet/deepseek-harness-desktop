[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Windows WebView2 desktop wrapper for DeepSeek Harness"
authors = ["DeepSeek Harness Desktop"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
