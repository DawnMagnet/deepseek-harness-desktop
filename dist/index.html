<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek Harness</title>
<style>body{font:16px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;height:100vh;margin:0}main{text-align:center}small{color:#94a3b8}</style>
<main><h1>DeepSeek Harness</h1><p id="status">正在启动本地服务…</p><small>首次启动可能需要几秒钟</small></main>
<script>
const status = document.getElementById('status');
let attempts = 0;
const probe = async () => {
  attempts += 1;
  try {
    await fetch('http://127.0.0.1:3080/', { mode: 'no-cors', cache: 'no-store' });
    location.replace('http://127.0.0.1:3080/');
  } catch {
    status.textContent = attempts > 60 ? '本地服务启动失败，请重启应用' : '正在启动本地服务…';
    if (attempts < 90) setTimeout(probe, 500);
  }
};
probe();
</script>
